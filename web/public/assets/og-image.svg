<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="NavListen — Satellites broadcast. We listen.">
  <defs>
    <radialGradient id="glow" cx="75%" cy="25%" r="70%">
      <stop offset="0" stop-color="#7046be" stop-opacity=".42"/>
      <stop offset="1" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#a78bfa" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a0a1a"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="700" width="500" height="630" fill="url(#grid)"/>
  <g transform="translate(74 66)">
    <g transform="scale(0.125)">
  <!-- Dark background -->
  <circle cx="256" cy="256" r="256" fill="#0d1117"/>

  <!--
    Four-color constellation ring (warm/cool alternating).

    Dash lengths are path units on a 2*pi*165 = 1036.7256 circumference, so a
    quadrant is 259.1814. Each arc paints 247.66 of that and starts half a gap
    (5.76 units = 2.00 deg) past its cardinal, which leaves a 4.00 deg gap
    *centered* on each crosshair tick rather than trailing it. Keep the offsets
    on the exact 259.1814 step; the older round 259 drifted 0.06 deg a quadrant.
    Do not restate these in degrees via pathLength: librsvg ignores it, so the
    dash then repeats three times per circle and shatters the ring.
  -->
  <g transform="rotate(-90 256 256)">
    <!-- GPS teal — 12 o'clock to 3 -->
    <circle cx="256" cy="256" r="165" fill="none" stroke="#2dd4bf" stroke-width="75"
      stroke-dasharray="247.66 789.06" stroke-dashoffset="-5.76"/>
    <!-- GLONASS orange — 3 to 6 -->
    <circle cx="256" cy="256" r="165" fill="none" stroke="#f0883e" stroke-width="75"
      stroke-dasharray="247.66 789.06" stroke-dashoffset="-264.94"/>
    <!-- Galileo blue — 6 to 9 -->
    <circle cx="256" cy="256" r="165" fill="none" stroke="#58a6ff" stroke-width="75"
      stroke-dasharray="247.66 789.06" stroke-dashoffset="-524.12"/>
    <!-- BeiDou purple — 9 to 12 -->
    <circle cx="256" cy="256" r="165" fill="none" stroke="#bc8cff" stroke-width="75"
      stroke-dasharray="247.66 789.06" stroke-dashoffset="-783.30"/>
  </g>

  <!-- Outer crosshair ticks (in the gaps between segments) -->
  <line x1="256" y1="22" x2="256" y2="50" stroke="rgba(230,237,243,0.7)" stroke-width="6" stroke-linecap="round"/>
  <line x1="462" y1="256" x2="490" y2="256" stroke="rgba(230,237,243,0.7)" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="462" x2="256" y2="490" stroke="rgba(230,237,243,0.7)" stroke-width="6" stroke-linecap="round"/>
  <line x1="22" y1="256" x2="50" y2="256" stroke="rgba(230,237,243,0.7)" stroke-width="6" stroke-linecap="round"/>

  <!-- Inner crosshair lines (ring inward toward center) -->
  <line x1="256" y1="131" x2="256" y2="220" stroke="rgba(230,237,243,0.4)" stroke-width="4" stroke-linecap="round"/>
  <line x1="292" y1="256" x2="381" y2="256" stroke="rgba(230,237,243,0.4)" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="292" x2="256" y2="381" stroke="rgba(230,237,243,0.4)" stroke-width="4" stroke-linecap="round"/>
  <line x1="131" y1="256" x2="220" y2="256" stroke="rgba(230,237,243,0.4)" stroke-width="4" stroke-linecap="round"/>

  <!-- Center targeting dot -->
  <circle cx="256" cy="256" r="26" fill="#e6edf3"/>
    </g>
    <text x="82" y="43" fill="#e6edf3" font-family="Arial, sans-serif" font-size="30" font-weight="700">navlisten</text>
  </g>
  <text x="74" y="282" fill="#e6edf3" font-family="Arial, sans-serif" font-size="72" font-weight="650" letter-spacing="-3">Satellites broadcast.</text>
  <text x="74" y="366" fill="#a78bfa" font-family="Georgia, serif" font-size="79" font-style="italic">We listen.</text>
  <text x="78" y="466" fill="#9ba4ae" font-family="Arial, sans-serif" font-size="24">Open hardware and software for studying satellite navigation.</text>
  <g fill="none" stroke="#a78bfa" stroke-opacity=".28">
    <ellipse cx="1005" cy="177" rx="160" ry="91" transform="rotate(-18 1005 177)"/>
    <ellipse cx="1005" cy="177" rx="120" ry="174" transform="rotate(31 1005 177)"/>
    <circle cx="1005" cy="177" r="46" fill="#161b22" stroke-opacity=".7"/>
  </g>
  <circle cx="867" cy="228" r="7" fill="#a78bfa"/>
  <circle cx="1085" cy="67" r="7" fill="#efc95b"/>
  <circle cx="1124" cy="278" r="7" fill="#bc8cff"/>
  <path d="M1005 223v188" stroke="#a78bfa" stroke-opacity=".28"/>
  <circle cx="1005" cy="427" r="9" fill="#0a0a1a" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="1005" cy="427" r="28" fill="none" stroke="#a78bfa" stroke-opacity=".22"/>
  <text x="78" y="567" fill="#a78bfa" font-family="monospace" font-size="17" letter-spacing="4">NAVLISTEN.COM  /  JOIN THE OPEN OBSERVATORY</text>
</svg>
