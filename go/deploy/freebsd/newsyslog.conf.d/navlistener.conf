# newsyslog(8) rotation for navlistener.
# Install as /usr/local/etc/newsyslog.conf.d/navlistener.conf
#
# The signal goes to the daemon(8) SUPERVISOR pidfile — NOT the collector's own child
# pidfile. daemon(8) is started with -H (see rc.d/navlistener), so on SIGHUP it reopens the
# -o output file onto the freshly-rotated path; the collector is never signalled and its
# ordered drain is never interrupted. (A SIGHUP delivered to the collector itself is ignored
# in main.go as a belt-and-braces guard, but rotation must target the supervisor.)
#
# fields: logfilename  owner:group  mode  count  size  when  flags  pidfile  signal
/var/log/navlistener.log  navlistener:navlistener  640  7  10240  *  JC  /var/run/navlistener/supervisor.pid  SIGHUP
